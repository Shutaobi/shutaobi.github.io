name: Build CV and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Compile CV with pdfLaTeX
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: Shutao_Bi_CV.tex
          texlive_version: 2025

      - name: Prepare website and check local links
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from shutil import copy2
          from urllib.parse import unquote, urlsplit

          site = Path('_site')
          site.mkdir()
          for name in ('index.html', 'styles.css', '.nojekyll'):
              copy2(name, site / name)
          for source in Path('thesis').rglob('*.pdf'):
              destination = site / source
              destination.parent.mkdir(parents=True, exist_ok=True)
              copy2(source, destination)
          (site / 'cv').mkdir()
          pdf = Path('Shutao_Bi_CV.pdf')
          assert pdf.read_bytes().startswith(b'%PDF-'), 'CV PDF is missing or invalid'
          copy2(pdf, site / 'cv' / pdf.name)

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links, self.ids = [], set()
              def handle_starttag(self, tag, attributes):
                  attributes = dict(attributes)
                  if 'id' in attributes:
                      self.ids.add(attributes['id'])
                  for key in ('href', 'src'):
                      if key in attributes:
                          self.links.append(attributes[key])

          page = Links()
          page.feed((site / 'index.html').read_text())
          for link in page.links:
              url = urlsplit(link)
              if url.scheme or url.netloc:
                  continue
              if url.path:
                  assert (site / unquote(url.path)).is_file(), f'Missing file: {link}'
              elif url.fragment:
                  assert unquote(url.fragment) in page.ids, f'Missing anchor: {link}'
          print('Website prepared; CV PDF and local links verified.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
